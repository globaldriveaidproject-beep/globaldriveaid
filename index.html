<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Global Drive Aid - Request Help</title>

  <style>
    body {
      background: #0a0f1f;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .form-box {
      background: rgba(255,255,255,0.05);
      padding: 25px;
      border-radius: 12px;
      width: 350px;
      backdrop-filter: blur(10px);
    }

    input, select, textarea {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      border-radius: 6px;
      border: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #00f5ff, #00ff87);
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="form-box">
  <h2>Request Help</h2>

  <form id="helpForm">

    <input type="text" name="name" placeholder="Your Name" required>
    
    <input type="text" name="location" placeholder="Location (Country / City)" required>

    <select name="type_of_help" required>
      <option value="">Type of Help</option>
      <option>Food</option>
      <option>Shelter</option>
      <option>Medical</option>
      <option>Other</option>
    </select>

    <textarea name="message" placeholder="Describe your situation..." required></textarea>

    <input type="email" name="email" placeholder="Your Email" required>

    <button type="submit">Submit Request</button>

  </form>
</div>

<script>
document.getElementById("helpForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const form = e.target;
  const data = new FormData(form);

  // 1️⃣ SEND TO FORMSUBMIT (EMAIL)
  fetch("https://formsubmit.co/help@globaldriveaid.com", {
    method: "POST",
    body: data
  });

  // 2️⃣ SEND TO ZAPIER (GOOGLE SHEETS)
  fetch("https://hooks.zapier.com/hooks/catch/27381366/uv44eeh/", {
    method: "POST",
    body: data
  });

  alert("Request submitted successfully");

  form.reset();
});
</script>

</body>
</html>
