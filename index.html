<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Global Drive Aid</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: black;
}

/* Globe canvas */
#globeCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* Form container */
.form-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.6);
  padding: 25px;
  border-radius: 12px;
  width: 320px;
  z-index: 2;
  backdrop-filter: blur(10px);
}

h2 {
  color: white;
  text-align: center;
}

input, textarea, select {
  width: 100%;
  margin: 8px 0;
  padding: 10px;
  border: none;
  border-radius: 6px;
}

button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(45deg,#00f0ff,#00ff9d);
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<canvas id="globeCanvas"></canvas>

<div class="form-container">
  <h2>Request Help</h2>

  <input id="name" placeholder="Your Name">
  <input id="location" placeholder="Location">

  <select id="type">
    <option>Shelter</option>
    <option>Food</option>
    <option>Medical</option>
  </select>

  <textarea id="message" placeholder="Describe your situation"></textarea>
  <input id="email" placeholder="Your Email">

  <button onclick="submitForm()">Submit Request</button>
</div>

<!-- THREE JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// Scene
const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.z = 4.5;

// Renderer
const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById("globeCanvas"),
  antialias: true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000);

// Globe geometry
const geometry = new THREE.SphereGeometry(2.5, 64, 64);

// Texture (stable + clear)
const texture = new THREE.TextureLoader().load(
  "https://threejs.org/examples/textures/land_ocean_ice_cloud_2048.jpg"
);

// Material
const material = new THREE.MeshPhongMaterial({
  map: texture,
  shininess: 5
});

// Globe mesh
const globe = new THREE.Mesh(geometry, material);
scene.add(globe);

// Lighting (balanced)
const light = new THREE.PointLight(0xffffff, 1.5);
light.position.set(5, 3, 5);
scene.add(light);

const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

// Animation
function animate() {
  requestAnimationFrame(animate);
  globe.rotation.y += 0.002;
  renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// Zapier form
function submitForm() {
  fetch("https://hooks.zapier.com/hooks/catch/27381366/uv44eeh/", {
    method: "POST",
    body: JSON.stringify({
      name: document.getElementById("name").value,
      location: document.getElementById("location").value,
      type: document.getElementById("type").value,
      message: document.getElementById("message").value,
      email: document.getElementById("email").value
    })
  });

  alert("Request submitted successfully");
}
</script>

</body>
</html>
