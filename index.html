<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mankind Global | NexPath AI</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at center, #03060f, #000);
  color: white;
}

/* HERO TEXT */
#overlay {
  position: absolute;
  top: 50%;
  left: 6%;
  transform: translateY(-50%);
  max-width: 520px;
  z-index: 10;
}

h1 { font-size: 52px; margin: 0; }
h2 { font-size: 16px; color: #00cfff; margin-bottom: 20px; }

p { opacity: 0.85; line-height: 1.6; }

.btn {
  margin-top: 20px;
  padding: 12px 22px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.primary {
  background: linear-gradient(45deg, #ff7a18, #ffb347);
  color: white;
}

.secondary {
  background: transparent;
  border: 1px solid #00cfff;
  color: #00cfff;
  margin-left: 10px;
}

/* MODAL FORM */
#formModal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 20;
}

.form-container {
  background: #0b0f1a;
  padding: 25px;
  border-radius: 10px;
  width: 90%;
  max-width: 420px;
}

.form-container h3 {
  margin-top: 0;
}

input, textarea, select {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #111827;
  border: none;
  color: white;
  border-radius: 5px;
}

textarea {
  resize: none;
  height: 90px;
}

.submit-btn {
  margin-top: 15px;
  width: 100%;
  background: #00cfff;
  color: black;
  font-weight: bold;
}

.close-btn {
  margin-top: 10px;
  width: 100%;
}

/* HUD */
#hud {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 12px;
  opacity: 0.7;
}
</style>
</head>

<body>

<!-- TEXT -->
<div id="overlay">
  <h1>MANKIND GLOBAL</h1>
  <h2>Powered by NexPath AI</h2>

  <p>
    A Global Humanitarian Intelligence System delivering aid, restoring dignity,
    and connecting humanity across borders through advanced technology.
  </p>

  <button class="btn primary" onclick="openForm()">Request Help</button>
  <button class="btn secondary">Donate</button>
</div>

<!-- HUD -->
<div id="hud">
  <div>GLOBAL NETWORK: ACTIVE</div>
  <div>NODES ONLINE: 12,483</div>
  <div>AID REQUESTS: LIVE</div>
</div>

<!-- FORM MODAL -->
<div id="formModal">
  <div class="form-container">
    <h3>Request Help</h3>

    <form action="https://formsubmit.co/help@globaldriveaid.com" method="POST">

      <!-- hidden configs -->
      <input type="hidden" name="_subject" value="New Help Request - Mankind Global">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="https://www.globaldriveaid.com">

      <input type="text" name="Name" placeholder="Full Name" required>
      <input type="text" name="Location" placeholder="Your Location" required>

      <select name="Type of Help">
        <option>Food</option>
        <option>Shelter</option>
        <option>Medical</option>
        <option>Other</option>
      </select>

      <textarea name="Message" placeholder="Describe your situation..." required></textarea>

      <input type="email" name="Email" placeholder="Your Email" required>

      <button type="submit" class="submit-btn">Submit Request</button>
    </form>

    <button class="close-btn" onclick="closeForm()">Close</button>
  </div>
</div>

<!-- THREE JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
function openForm() {
  document.getElementById("formModal").style.display = "flex";
}

function closeForm() {
  document.getElementById("formModal").style.display = "none";
}

let scene, camera, renderer, globe;

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.z = 3;

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const geometry = new THREE.SphereGeometry(1, 64, 64);
  const material = new THREE.MeshBasicMaterial({
    color: 0x00cfff,
    wireframe: true
  });

  globe = new THREE.Mesh(geometry, material);
  scene.add(globe);

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  globe.rotation.y += 0.002;
  renderer.render(scene, camera);
}

window.onload = init;
</script>

</body>
</html>
