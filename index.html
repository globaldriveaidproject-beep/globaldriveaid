<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mankind Global</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  background: black;
  overflow: hidden;
}

.bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('map.jpg') no-repeat center center/cover;
  z-index: 0;
  filter: brightness(0.4);
}

.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: linear-gradient(to right, rgba(0,0,0,0.9), rgba(0,0,0,0.5));
  z-index: 1;
}

.left-panel {
  position: absolute;
  left: 60px;
  top: 50%;
  transform: translateY(-50%);
  max-width: 420px;
  z-index: 2;
}

.left-panel h1 {
  font-size: 60px;
  margin: 0;
}

.left-panel span {
  color: orange;
}

.left-panel p {
  margin-top: 20px;
}

.btn {
  margin-top: 20px;
  padding: 12px 20px;
  border-radius: 6px;
  cursor: pointer;
  border: none;
}

.btn-primary {
  background: orange;
  color: white;
}

.btn-secondary {
  background: transparent;
  border: 1px solid white;
  color: white;
}

.right-panel {
  position: absolute;
  right: 40px;
  top: 50%;
  transform: translateY(-50%);
  width: 260px;
  z-index: 2;
}

.card {
  background: rgba(0,0,0,0.6);
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
}

.status {
  color: lime;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="left-panel">
  <h1>MANKIND <span>GLOBAL</span></h1>
  <p>
    A global humanitarian intelligence system delivering aid,
    restoring dignity, and connecting humanity across borders.
  </p>

  <button class="btn btn-primary">Request Aid</button>
  <button class="btn btn-secondary">Donate</button>
</div>

<div class="right-panel">
  <div class="card">
    <h3>System Status</h3>
    <div class="status">● ONLINE</div>
  </div>

  <div class="card">
    <h3>Real-Time Overview</h3>
    <p>Aid Requests: 24,985</p>
    <p>People Helped: 8.7M</p>
    <p>Missions: 142</p>
  </div>
</div>

</body>
</html>
