<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mankind Global</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  overflow: hidden;

  /* 🔥 GUARANTEED BACKGROUND */
  background: radial-gradient(circle at center, #0a0f1f, #000000 80%);
}

/* LEFT PANEL */
.left {
  position: absolute;
  left: 80px;
  top: 50%;
  transform: translateY(-50%);
  max-width: 500px;
}

.left h1 {
  font-size: 70px;
}

.left span {
  color: #00f0ff;
}

.left p {
  margin-top: 20px;
  line-height: 1.6;
}

/* BUTTONS */
.btn {
  margin-top: 20px;
  padding: 12px 20px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}

.primary {
  background: linear-gradient(45deg,#00f0ff,#00ffcc);
  color: black;
}

.secondary {
  background: transparent;
  border: 1px solid white;
  color: white;
}

/* RIGHT PANEL */
.right {
  position: absolute;
  right: 60px;
  top: 50%;
  transform: translateY(-50%);
  width: 260px;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
  backdrop-filter: blur(10px);
}

.status {
  color: #00ff88;
}
</style>
</head>

<body>

<div class="left">
  <h1>NEXPATH <span>AI</span></h1>

  <p>
    A global humanitarian intelligence system delivering aid,
    restoring dignity, and connecting humanity through AI.
  </p>

  <button class="btn primary">Request Aid</button>
  <button class="btn secondary">Donate</button>
</div>

<div class="right">
  <div class="card">
    <h3>System Status</h3>
    <div class="status">● ONLINE</div>
  </div>

  <div class="card">
    <h3>Live Data</h3>
    <p>Requests: 24,985</p>
    <p>People Helped: 8.7M</p>
  </div>
</div>

</body>
</html>
